[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-risk-graph"
dynamic = ["version"]
description = "Find the people your security depends on: bus factor, approval concentration and control-bypass risk with a fix plan, SARIF and ISO 27001 / SOC 2 / DORA mapping"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Aleksei Aleinikov", email = "contact@alekseialeinikov.com" }]
requires-python = ">=3.10"
keywords = [
    "cybersecurity",
    "risk-analysis",
    "graph-theory",
    "organizational-security",
    "bus-factor",
    "security-metrics",
    "sarif",
    "compliance",
    "dora",
    "soc2",
    "iso27001",
    "gdpr",
    "segregation-of-duties",
    "access-review",
    "github",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "pyvis>=0.3.2",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "jsonschema>=4.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "bandit>=1.7.0",
]
experiments = ["pandas>=2.0.0", "matplotlib>=3.7.0"]

[project.scripts]
hrg = "human_risk_graph.cli:main"

[project.urls]
Homepage = "https://github.com/LF3551/human-risk-graph"
Documentation = "https://github.com/LF3551/human-risk-graph/blob/main/docs/model.md"
Changelog = "https://github.com/LF3551/human-risk-graph/blob/main/CHANGELOG.md"
Issues = "https://github.com/LF3551/human-risk-graph/issues"
DOI = "https://doi.org/10.5281/zenodo.18288055"

[tool.setuptools.dynamic]
version = { attr = "human_risk_graph.__version__" }

[tool.setuptools.package-data]
human_risk_graph = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["human_risk_graph"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/human_risk_graph/cli.py",
    "*/human_risk_graph/reports.py",
    "*/human_risk_graph/visualization.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.bandit]
# B608 (SQL built from strings): there is no SQL; it flags f-strings of HTML/SVG markup.
skips = ["B608"]
