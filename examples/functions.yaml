# yaml-language-server: $schema=https://raw.githubusercontent.com/LF3551/human-risk-graph/main/src/human_risk_graph/organization.schema.json
#
# Critical functions for model hrg-3 (experimental). Analyze with:
#   hrg analyze examples/functions.yaml --model hrg-3

people:
  - {id: alice, name: Alice, role: Head of Platform, criticality: 0.9}
  - {id: bob, name: Bob, role: SRE, criticality: 0.7}
  - {id: carol, name: Carol, role: Security Engineer, criticality: 0.7}
  - {id: dan, name: Dan, role: Developer, criticality: 0.4,
     last_active: never}   # or a date such as 2026-03-01; inactive people are HRG007

# The hrg-2 graph still drives the dependency map in the HTML report.
dependencies:
  - {from: alice, to: bob, type: approval, weight: 0.8}
  - {from: alice, to: dan, type: approval, weight: 0.6}
  - {from: carol, to: dan, type: approval, weight: 0.4}

functions:
  - id: merge
    name: Merge to main
    criticality: 0.8
    requires: 2            # author and one reviewer
    performers: [alice, bob, carol, dan]
    alone: [alice]         # admin who can bypass the branch rules
  - id: release
    name: Publish a release
    criticality: 0.9
    requires: 1
    performers: [alice, bob]
  - id: restore-db
    name: Restore the production database
    criticality: 0.9
    requires: 1
    separation: not-required   # the on-call engineer restores alone by design
    performers: [bob]
  - id: rotate-keys
    name: Rotate signing keys
    criticality: 0.7
    requires: 2
    performers: [alice, carol]
