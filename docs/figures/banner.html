<!doctype html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; box-sizing: border-box; }
body { width: 1280px; height: 640px; overflow: hidden; font-family: -apple-system, "SF Pro Display", Inter, "Segoe UI", sans-serif;
  background: radial-gradient(1200px 600px at 85% 40%, #1e1b4b 0%, #0b1120 55%, #070b16 100%); color: #e5e7eb; position: relative; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
  linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px); background-size: 40px 40px; }
.left { position: absolute; left: 72px; top: 64px; width: 640px; }
.pill { display: inline-block; font-size: 15px; letter-spacing: .14em; font-weight: 600; color: #a5b4fc;
  border: 1px solid rgba(165,180,252,.35); padding: 6px 14px; border-radius: 99px; }
h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; margin-top: 26px; color: #fff; }
h1 span { background: linear-gradient(90deg, #fb923c, #ef4444); -webkit-background-clip: text; color: transparent; }
.tag { font-size: 30px; line-height: 1.3; color: #cbd5e1; margin-top: 22px; font-weight: 500; letter-spacing: -0.01em; }
.chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-size: 17px; padding: 7px 14px; border-radius: 10px; background: rgba(30,41,59,.85); border: 1px solid #334155; color: #e2e8f0; }
.chip b { color: #fb923c; font-weight: 700; }
.cmd { position: absolute; left: 72px; bottom: 44px; font: 22px ui-monospace, "SF Mono", Menlo, monospace; color: #e2e8f0;
  background: rgba(15,23,42,.9); border: 1px solid #334155; border-radius: 12px; padding: 14px 20px; }
.cmd i { color: #64748b; font-style: normal; }
svg.graph { position: absolute; right: 30px; top: 6px; }
.card { position: absolute; right: 56px; bottom: 36px; width: 250px; background: rgba(15,23,42,.92); border: 1px solid #334155;
  border-radius: 18px; padding: 18px 20px; display: flex; gap: 16px; align-items: center; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.card .t { font-size: 14px; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.card .g { font-size: 22px; font-weight: 750; color: #fff; margin-top: 2px; }
.card .f { font-size: 15px; color: #4ade80; margin-top: 4px; font-weight: 600; }
</style></head><body>
<div class="grid"></div>
<svg class="graph" width="560" height="520" viewBox="0 0 560 520">
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#ef4444" stop-opacity=".55"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#818cf8"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  </defs>
  <g stroke-width="2.4" fill="none">
    <line x1="150" y1="110" x2="268" y2="196" stroke="#818cf8" marker-end="url(#a)"/>
    <line x1="420" y1="96" x2="312" y2="190" stroke="#818cf8" marker-end="url(#a)"/>
    <line x1="290" y1="232" x2="290" y2="320" stroke="#818cf8" marker-end="url(#a)"/>
    <line x1="270" y1="225" x2="132" y2="300" stroke="#64748b" stroke-dasharray="6 6"/>
    <line x1="312" y1="226" x2="452" y2="286" stroke="#64748b" stroke-dasharray="6 6"/>
    <line x1="290" y1="356" x2="196" y2="430" stroke="#818cf8" marker-end="url(#a)"/>
    <line x1="290" y1="356" x2="392" y2="428" stroke="#818cf8" marker-end="url(#a)"/>
    <path d="M 430 112 C 520 210, 500 330, 410 420" stroke="#ef4444" stroke-dasharray="9 6" stroke-width="3" marker-end="url(#r)"/>
  </g>
  <circle cx="290" cy="210" r="70" fill="url(#glow)"/>
  <g stroke="#0b1120" stroke-width="4">
    <circle cx="140" cy="100" r="17" fill="#f59e0b"/>
    <circle cx="432" cy="88" r="20" fill="#f59e0b"/>
    <circle cx="290" cy="210" r="28" fill="#ef4444"/>
    <circle cx="120" cy="308" r="13" fill="#64748b"/>
    <circle cx="466" cy="292" r="13" fill="#64748b"/>
    <circle cx="290" cy="340" r="18" fill="#ef4444"/>
    <circle cx="186" cy="438" r="13" fill="#64748b"/>
    <circle cx="402" cy="436" r="14" fill="#64748b"/>
  </g>
  <g font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    <text x="290" y="168">single point of failure</text>
    <text x="494" y="206" fill="#fca5a5" text-anchor="start">bypass</text>
  </g>
</svg>
<div class="left">
  <span class="pill">OPEN SOURCE · PYTHON · CLI</span>
  <h1>Human <span>Risk</span> Graph</h1>
  <p class="tag">Find the people your security depends on — and the fixes that matter most.</p>
  <div class="chips">
    <span class="chip"><b>Bus factor</b></span><span class="chip">Approval concentration</span>
    <span class="chip">Control bypass</span><span class="chip">Fix plan</span>
    <span class="chip">SARIF · DORA · SOC 2 · ISO 27001</span>
  </div>
</div>
<div class="cmd"><i>$</i> pip install human-risk-graph</div>
<div class="card">
  <svg width="74" height="74" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#1e293b" stroke-width="12"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round" stroke-dasharray="192 314" transform="rotate(-90 60 60)"/>
    <text x="60" y="72" text-anchor="middle" font-size="36" font-weight="800" fill="#fff">61</text></svg>
  <div><div class="t">Score</div><div class="g">Grade D</div><div class="f">3 fixes → 81</div></div>
</div>
</body></html>
