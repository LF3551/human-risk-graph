name: Feature request
description: A new data source, report or model change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to find out about your organization, and what is missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What HRG could do. For model changes, how it would change the score and why.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How you work around it today, or other tools you have tried.
