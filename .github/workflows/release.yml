name: Release Automation

on:
  release:
    types: [published]

permissions: read-all

jobs:
  software-heritage:
    name: Archive on Software Heritage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Save to Software Heritage
      run: |
        RESPONSE=$(curl -s -o /tmp/swh_response.json -w "%{http_code}" \
          -X POST \
          "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/${{ github.repository }}/")
        echo "HTTP status: $RESPONSE"
        cat /tmp/swh_response.json
        if [[ "$RESPONSE" == "200" || "$RESPONSE" == "201" ]]; then
          echo "✅ Software Heritage save request accepted"
        else
          echo "⚠️  Unexpected status $RESPONSE — check response above"
          exit 1
        fi

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}

  sign-artifacts:
    name: Sign Release Artifacts
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write    # upload assets to release
      id-token: write    # sigstore OIDC signing

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Sign artifacts with Sigstore
      uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
      with:
        inputs: ./dist/*.whl ./dist/*.tar.gz

    - name: Upload signatures to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.ref_name }} dist/*.sigstore.json --clobber

  attest:
    name: Attest Build Provenance
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      attestations: write  # create build provenance attestations
      id-token: write      # OIDC token for attestation signing
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Attest build provenance
      uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
      with:
        subject-path: dist/*
