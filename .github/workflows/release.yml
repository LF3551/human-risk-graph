name: Release Automation

on:
  release:
    types: [published]

permissions: read-all

jobs:
  software-heritage:
    name: Archive on Software Heritage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Save to Software Heritage
      run: |
        RESPONSE=$(curl -s -o /tmp/swh_response.json -w "%{http_code}" \
          -X POST \
          "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/${{ github.repository }}/")
        echo "HTTP status: $RESPONSE"
        cat /tmp/swh_response.json
        if [[ "$RESPONSE" == "200" || "$RESPONSE" == "201" ]]; then
          echo "✅ Software Heritage save request accepted"
        else
          echo "⚠️  Unexpected status $RESPONSE — check response above"
          exit 1
        fi

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}
