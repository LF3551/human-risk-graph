name: Release Automation

on:
  release:
    types: [published]

permissions: read-all

jobs:
  software-heritage:
    name: Archive on Software Heritage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Save to Software Heritage
      run: |
        RESPONSE=$(curl -s -o /tmp/swh_response.json -w "%{http_code}" \
          -X POST \
          "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/${{ github.repository }}/")
        echo "HTTP status: $RESPONSE"
        cat /tmp/swh_response.json
        if [[ "$RESPONSE" == "200" || "$RESPONSE" == "201" ]]; then
          echo "✅ Software Heritage save request accepted"
        else
          echo "⚠️  Unexpected status $RESPONSE — check response above"
          exit 1
        fi

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'

    - name: Check release tag matches project version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: python .github/scripts/check_version.py "$TAG"

    - name: Build and check package
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*

    - name: Upload distributions
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  # The same files built above are published, signed and attested.
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/human-risk-graph
    permissions:
      id-token: write  # PyPI Trusted Publishing and PEP 740 attestations

    steps:
    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Sign, attest and attach to GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write      # upload release assets
      id-token: write      # Sigstore and attestation signing
      attestations: write  # build provenance attestations

    steps:
    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*

    # Uploads the distributions and their .sigstore.json bundles to the release
    - name: Sign with Sigstore
      uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
      with:
        inputs: ./dist/*.whl ./dist/*.tar.gz
