name: Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  file:
    name: Analyze a file (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: hrg
        with:
          file: examples/organization.yaml
          upload-sarif: "false"
          artifact-name: hrg-report-${{ matrix.os }}
      - name: Check outputs
        shell: bash
        env:
          SCORE: ${{ steps.hrg.outputs.score }}
          GRADE: ${{ steps.hrg.outputs.grade }}
          ERRORS: ${{ steps.hrg.outputs.errors }}
          SARIF: ${{ steps.hrg.outputs.sarif-file }}
        run: |
          set -eu
          test "$SCORE" = 25 && test "$GRADE" = F && test "$ERRORS" = 3
          for ext in json md html sarif; do test -s "hrg-report/organization_report.$ext"; done
          test -s "$SARIF"

  threshold:
    name: Fail below min-score
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: gate
        continue-on-error: true
        with:
          file: examples/organization.yaml
          min-score: "90"
          upload-sarif: "false"
          artifact-name: hrg-report-threshold
      - name: Check that the gate failed after publishing outputs
        shell: bash
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          SCORE: ${{ steps.gate.outputs.score }}
        run: test "$OUTCOME" = failure && test "$SCORE" = 25

  scan:
    name: Scan this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: hrg
        with:
          scan: ${{ github.repository }}
          max-prs: "20"
          model: hrg-3
          inactive-days: "60"
          artifact-name: hrg-report-scan
      - name: Check outputs and the hrg-3 draft
        shell: bash
        env:
          SCORE: ${{ steps.hrg.outputs.score }}
          REPORT_DIR: ${{ steps.hrg.outputs.report-dir }}
        run: |
          test -n "$SCORE"
          grep -q '"model": "hrg-3"' "$REPORT_DIR"/*_report.json

  scan-org:
    name: Scan an organization, pseudonymized
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: hrg
        env:
          HRG_PSEUDONYM_KEY: self-test-key-not-secret-0123456789
        with:
          scan-org: ${{ github.repository_owner }}
          max-repos: "2"
          max-prs: "10"
          pseudonymize: "true"
          artifact-name: hrg-report-scan-org
      - name: Check outputs and that no login reached the reports
        shell: bash
        env:
          SCORE: ${{ steps.hrg.outputs.score }}
          DIR: ${{ steps.hrg.outputs.report-dir }}
          DRAFT: ${{ runner.temp }}/${{ github.repository_owner }}-org.yaml
        run: |
          set -euo pipefail
          test -n "$SCORE"
          if ls "$DIR"/*-org.yaml 2>/dev/null; then echo "::error::draft uploaded"; exit 1; fi
          grep -q "pseudonymized" "$DIR"/*_report.md
          logins=$(awk '/^people:/{p=1;next} /^[a-z]/{p=0} p && /^- id: /{print $3}' "$DRAFT" | tr -d "'")
          test -n "$logins"
          for login in $logins; do
            # The reports link to this tool's repository, which belongs to the scanned owner.
            if sed 's#github.com/LF3551/human-risk-graph##g' "$DIR"/* | grep -qF -w -- "$login"; then
              echo "::error::login $login found in a report"; exit 1
            fi
            if ls "$DIR" | grep -qF -- "$login"; then
              echo "::error::login $login in a report file name"; exit 1
            fi
          done
